name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository boundaries
        run: python3 scripts/check_publication.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned project and validation dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Run offline synthetic tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-spanish texlive-fonts-recommended fonts-lmodern
      - name: Compile the public report and presentation
        run: |
          python scripts/compile_report.py
          cd reports/presentation
          for pass in 1 2 3; do
            xelatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error Presentacion_Beyond_Beta.tex
          done
      - name: Upload compiled documents
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Beta-documentos
          path: |
            reports/report/informe.pdf
            reports/presentation/Presentacion_Beyond_Beta.pdf
